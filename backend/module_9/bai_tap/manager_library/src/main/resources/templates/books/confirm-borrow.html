<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Mượn Sách - Quản Lý Thư Viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Bootstrap 5 Modal Xác Nhận (Tự động mở khi trang tải) -->
<div class="modal fade" id="confirmBorrowModal" tabindex="-1" aria-labelledby="confirmBorrowModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            
            <!-- Modal Header -->
            <div class="modal-header bg-warning text-dark py-3">
                <h5 class="modal-title fw-bold" id="confirmBorrowModalLabel">
                    <i class="bi bi-shield-check me-2"></i>Xác Nhận Mượn Sách
                </h5>
            </div>

            <!-- Form Xác Nhận -->
            <form th:action="@{/books/borrowing-list}" method="get">
                <!-- Modal Body -->
                <div class="modal-body p-4 text-center">
                    <p class="text-muted mb-1">Bạn có chắc chắn muốn mượn cuốn sách:</p>
                    <h5 class="fw-bold text-primary mb-3" th:text="${book.name}">Tên cuốn sách</h5>

                    <!-- Hộp hiển thị mã mượn sách -->
                    <div class="p-3 bg-light border border-2 border-warning rounded-3 mb-3">
                        <div class="text-muted small fw-semibold text-uppercase mb-1">MÃ MƯỢN SÁCH CỦA BẠN</div>
                        <div class="display-6 fw-bold text-danger" th:text="${borrowCode}"></div>
                        <small class="text-muted fst-italic">Vui lòng ghi nhớ mã này để thực hiện trả sách</small>
                    </div>

                    <p class="text-secondary small mb-0">
                        Nhấn <strong>"OK"</strong> để hoàn tất mượn sách hoặc <strong>"Hủy"</strong> để quay lại.
                    </p>
                </div>

                <!-- Modal Footer chứa 2 nút OK và Hủy -->
                <div class="modal-footer bg-light d-flex justify-content-end gap-2 border-0 px-4 pb-4 pt-0">
                    <!-- Nút Hủy (Quay lại trang chi tiết) -->
                    <a th:href="@{/books/detail/{id}(id=${book.id})}" class="btn btn-outline-secondary px-4 fw-semibold">
                        <i class="bi bi-x-circle me-1"></i> Hủy
                    </a>
                    
                    <!-- Nút OK (Xác nhận mượn) -->
                    <button type="submit" class="btn btn-success px-4 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i> OK
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tự động kích hoạt Modal ngay khi trang tải xong -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var myModal = new bootstrap.Modal(document.getElementById('confirmBorrowModal'));
        myModal.show();
    });
</script>
</body>
</html>
