<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sách - Quản Lý Thư Viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <!-- Tiêu đề & Nút thêm mới -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-primary fw-bold mb-1">📚 Danh Sách Sách</h2>
            <p class="text-muted mb-0">Quản lý và theo dõi thông tin sách trong thư viện</p>
        </div>
        <div>
            <a href="#" class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i> Thêm Sách Mới
            </a>
        </div>
    </div>

    <!-- Thanh tìm kiếm & lọc dữ liệu mẫu -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form class="row g-3">
                <div class="col-md-8">
                    <input type="text" class="form-control" placeholder="Nhập tên sách, tác giả...">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search me-1"></i> Tìm kiếm
                    </button>
                    <button type="reset" class="btn btn-outline-secondary">Làm mới</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng danh sách sách (Table) -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th scope="col" style="width: 10%">Mã Sách</th>
                            <th scope="col" style="width: 30%">Tên Sách</th>
                            <th scope="col" class="text-center" style="width: 15%">Số Lượng</th>
                            <th scope="col" class="text-center" style="width: 20%">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dòng dữ liệu mẫu 1 -->
                        <tr th:each="book : ${bookPage.getContent()}">
                            <td><span class="badge bg-secondary" th:text="${book.id}"></span></td>
                            <td class="fw-semibold" th:text="${book.name}"></td>
                            <td class="text-center">
                                <span class="badge bg-success" th:text="${book.remaining}"></span>
                            </td>
                            <td class="text-center">
                                    <a th:href="@{/books/detail/{id}(id=${book.id})}" class="btn btn-sm btn-warning text-white me-1" title="Mượn sách">
                                    <i class="bi bi-journal-arrow-down"></i> Mượn
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Phân trang (Pagination) -->
        <div class="card-footer bg-white py-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="text-muted small">
                    Hiển thị <strong>1 - 3</strong> trong tổng số <strong>30</strong> cuốn sách
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0 justify-content-center">
                        <li class="page-item" th:classappend="${!bookPage.hasPrevious()} ? 'disabled'">
                            <a class="page-link" th:href="@{/books(page=${bookPage.number - 1})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item"
                            th:if="${bookPage.totalPages > 0}"
                            th:each="i : ${#numbers.sequence(0,bookPage.totalPages - 1)}"
                            th:classappend="${i == bookPage.number} ? 'active'">
                            <a class="page-link" th:href="@{/books(page=${i})}" th:text="${i+1}">
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${!bookPage.hasNext()} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/books(page=${bookPage.number + 1})}"
                               aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
