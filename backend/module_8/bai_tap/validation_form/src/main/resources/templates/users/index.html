<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký User</title>
    <!-- Thêm Bootstrap để form đẹp hơn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4 text-center">Đăng ký thành viên</h2>
            
            <!-- Form binding với đối tượng userDTO từ Controller -->
            <form action="/users/create" th:object="${userRequestDTO}" method="post" class="card p-4 shadow-sm">
                
                <!-- First Name -->
                <div class="mb-3">
                    <label for="firstName" class="form-label">Tên (First Name) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" 
                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:text="${#fields.errors('firstName')[0]}"></div>
                </div>

                <!-- Last Name -->
                <div class="mb-3">
                    <label for="lastName" class="form-label">Họ (Last Name) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:text="${#fields.errors('lastName')[0]}"></div>
                </div>

                <!-- Age -->
                <div class="mb-3">
                    <label for="age" class="form-label">Tuổi (Age) <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="age" th:field="*{age}"
                           th:classappend="${#fields.hasErrors('age')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('age')}" th:text="${#fields.errors('age')[0]}"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Đăng ký</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
