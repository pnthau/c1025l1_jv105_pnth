<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Quản lý Q&A Học Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
        .badge-waiting {
            background-color: #ffc107;
            color: #000;
        }
        .badge-response {
            background-color: #198754;
            color: #fff;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(13, 110, 253, 0.05);
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-dark mb-4" style="background-color: #17a2b8; padding: 10px 24px;">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-semibold text-white mb-0" th:href="@{/questions}" style="font-size: 1.15rem; letter-spacing: 0.3px;">
                CodeGymDN
            </a>
        </div>
    </nav>

    <footer th:fragment="footer" class="bg-white py-3 border-top mt-auto text-center text-muted">
        <div class="container">
            <small>&copy; 2026 CodeGym Q&A Management System. All rights reserved.</small>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>
</body>
</html>
