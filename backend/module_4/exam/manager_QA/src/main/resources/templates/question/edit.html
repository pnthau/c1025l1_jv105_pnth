<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Chỉnh Sửa & Phản Hồi Câu Hỏi - Q&A')}">
    <meta charset="UTF-8">
    <title>Chỉnh Sửa Câu Hỏi</title>
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>

    <main class="main-content container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-warning text-dark py-3">
                        <h4 class="mb-0 fw-bold">
                            <i class="bi bi-pencil-square me-2"></i>Chỉnh Sửa & Phản Hồi Câu Hỏi
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/questions/{id}/edit(id=${questionId})}" th:object="${questionDTO}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <!-- Tiêu đề câu hỏi -->
                            <div class="mb-3">
                                <label for="title" class="form-label fw-semibold">
                                    Tiêu đề câu hỏi <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="title" th:field="*{title}"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                    Lỗi tiêu đề
                                </div>
                            </div>

                            <!-- Loại câu hỏi -->
                            <div class="mb-3">
                                <label for="questionTypeId" class="form-label fw-semibold">
                                    Loại câu hỏi <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="questionTypeId" th:field="*{questionTypeId}"
                                        th:classappend="${#fields.hasErrors('questionTypeId')} ? 'is-invalid'">
                                    <option value="">-- Chọn loại câu hỏi --</option>
                                    <option th:each="type : ${questionTypes}"
                                            th:value="${type.id}"
                                            th:text="${type.name}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('questionTypeId')}" th:errors="*{questionTypeId}">
                                    Vui lòng chọn loại câu hỏi
                                </div>
                            </div>

                            <div class="row">
                                <!-- Ngày tạo -->
                                <div class="col-md-6 mb-3">
                                    <label for="date" class="form-label fw-semibold">
                                        Ngày gửi câu hỏi <span class="text-danger">*</span>
                                    </label>
                                    <input type="date" class="form-control" id="date" th:field="*{date}"
                                           th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">
                                        Ngày không hợp lệ
                                    </div>
                                </div>

                                <!-- Trạng thái -->
                                <div class="col-md-6 mb-3">
                                    <label for="status" class="form-label fw-semibold">
                                        Tình trạng xử lý <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" id="status" th:field="*{status}">
                                        <option th:each="st : ${statuses}"
                                                th:value="${st}"
                                                th:text="${st.displayName}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <!-- Nội dung câu hỏi -->
                            <div class="mb-3">
                                <label for="content" class="form-label fw-semibold">
                                    Nội dung chi tiết câu hỏi <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="content" th:field="*{content}" rows="5"
                                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
                                    Nội dung không hợp lệ
                                </div>
                            </div>

                            <!-- Phản hồi từ trung tâm -->
                            <div class="mb-3">
                                <label for="answer" class="form-label fw-semibold text-primary">
                                    <i class="bi bi-reply-fill me-1"></i>Phản hồi từ Trung tâm (Câu trả lời)
                                </label>
                                <textarea class="form-control" id="answer" th:field="*{answer}" rows="5"
                                          placeholder="Nhập câu trả lời phản hồi cho học viên..."></textarea>
                                <small class="text-muted">Khi điền câu trả lời, hãy nhớ chuyển trạng thái sang "Đã phản hồi".</small>
                            </div>

                            <!-- Nút thao tác -->
                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/questions}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                                </a>
                                <button type="submit" class="btn btn-warning px-4 fw-semibold">
                                    <i class="bi bi-save me-1"></i>Lưu Thay Đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
