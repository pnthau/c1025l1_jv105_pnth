<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Tạo Câu Hỏi Mới - Q&A')}">
    <meta charset="UTF-8">
    <title>Tạo Câu Hỏi Mới</title>
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>

    <main class="main-content container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0 fw-bold">
                            <i class="bi bi-question-circle-fill me-2"></i>Đặt Câu Hỏi Mới
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/questions/create}" th:object="${questionDTO}" method="post">
                            <!-- Tiêu đề câu hỏi -->
                            <div class="mb-3">
                                <label for="title" class="form-label fw-semibold">
                                    Tiêu đề câu hỏi <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="title" th:field="*{title}"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="Ví dụ: Thắc mắc về quy chế bảo lưu kết quả học tập">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                    Lỗi tiêu đề
                                </div>
                            </div>

                            <!-- Loại câu hỏi -->
                            <div class="mb-3">
                                <label for="questionTypeId" class="form-label fw-semibold">
                                    Loại câu hỏi <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="questionTypeId" th:field="*{questionTypeId}"
                                        th:classappend="${#fields.hasErrors('questionTypeId')} ? 'is-invalid'">
                                    <option value="">-- Chọn loại câu hỏi --</option>
                                    <option th:each="type : ${questionTypes}"
                                            th:value="${type.id}"
                                            th:text="${type.name}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('questionTypeId')}" th:errors="*{questionTypeId}">
                                    Vui lòng chọn loại câu hỏi
                                </div>
                            </div>

                            <!-- Nội dung chi tiết câu hỏi -->
                            <div class="mb-3">
                                <label for="content" class="form-label fw-semibold">
                                    Nội dung chi tiết câu hỏi <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="content" th:field="*{content}" rows="6"
                                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                          placeholder="Mô tả cụ thể và chi tiết câu hỏi của bạn để trung tâm hỗ trợ tốt nhất..."></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
                                    Nội dung câu hỏi không hợp lệ
                                </div>
                            </div>

                            <!-- Trạng thái mặc định: WAITING -->
                            <input type="hidden" th:field="*{status}">

                            <!-- Nút thao tác -->
                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/questions}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-send-fill me-1"></i>Gửi Câu Hỏi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
