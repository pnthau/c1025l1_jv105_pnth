<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bài hát</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 50px;
        }
        audio {
            height: 35px;
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center text-primary mb-4">🎶 Danh sách bài hát (Audio)</h2>
    
    <!-- Nút thêm mới -->
    <div class="mb-3 d-flex justify-content-end">
        <a th:href="@{/audio/form}" class="btn btn-success">+ Thêm bài hát mới</a>
    </div>

    <!-- Bảng hiển thị danh sách -->
    <table class="table table-hover table-bordered align-middle">
        <thead class="table-dark text-center">
            <tr>
                <th>STT</th>
                <th>Tên bài hát</th>
                <th>Nghệ sĩ</th>
                <th>Thể loại</th>
                <th>Phát nhạc</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="audio, iterStat : ${audioList}">
                <td class="text-center" th:text="${iterStat.count}">1</td>
                <td th:text="${audio.name}">Tên bài hát</td>
                <td th:text="${audio.getSinger}">Nghệ sĩ</td>
                <td th:text="${#strings.listJoin(audio.types, ', ')}">Thể loại</td>
                <td class="text-center">
                    <audio controls th:src="${audio.path}" preload="none">
                        Trình duyệt của bạn không hỗ trợ thẻ audio.
                    </audio>
                </td>
                <td class="text-center">
                    <a th:href="@{/audio/edit/{name}(name=${audio.name})}" class="btn btn-sm btn-warning">Sửa</a>
                </td>
            </tr>
            <tr th:if="${audioList == null or audioList.isEmpty()}">
                <td colspan="6" class="text-center text-muted">Chưa có bài hát nào trong danh sách.</td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
