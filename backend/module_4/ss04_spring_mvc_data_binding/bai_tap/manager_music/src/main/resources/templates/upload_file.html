<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm bài hát mới (Upload File)</title>
    <!-- Thêm Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 50px;
            max-width: 600px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center text-success mb-4">🎵 Thêm bài hát mới</h3>
    
    <div class="mb-3">
        <!-- Nút quay lại danh sách -->
        <a th:href="@{/audio/list}" class="btn btn-outline-secondary">&larr; Quay lại danh sách</a>
    </div>

    <div th:if="${message}" class="alert alert-danger" role="alert" th:text="${message}">
    </div>

    <form th:action="@{/audio/upload}" th:object="${audioForm}" method="post" enctype="multipart/form-data">
        
        <!-- Tên bài hát -->
        <div class="mb-3">
            <label for="name" class="form-label">Tên bài hát:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required placeholder="Nhập tên bài hát...">
        </div>

        <!-- Nhạc sĩ (musican) -->
        <div class="mb-3">
            <label for="singer" class="form-label">Nhạc sĩ :</label>
            <input type="text" id="singer" th:field="*{singer}" class="form-control" required placeholder="Nhập tên nhạc sĩ...">
        </div>

        <!-- Thể loại (types) - List<String> nên dùng checkbox -->
        <div class="mb-3">
            <label class="form-label">Thể loại:</label><br/>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="typePop" th:field="*{types}" value="Pop">
                <label class="form-check-label" for="typePop">Pop</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="typeRock" th:field="*{types}" value="Rock">
                <label class="form-check-label" for="typeRock">Rock</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="typeBallad" th:field="*{types}" value="Ballad">
                <label class="form-check-label" for="typeBallad">Ballad</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="typeEDM" th:field="*{types}" value="EDM">
                <label class="form-check-label" for="typeEDM">EDM</label>
            </div>
        </div>

        <!-- File nhạc -->
        <div class="mb-4">
            <label for="audioFile" class="form-label">Chọn file nhạc (mp3, wav...):</label>
            <input type="file" id="audioFile" th:field="*{audioFile}" class="form-control" accept="audio/*" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success text-white fw-bold">Tải lên (Upload)</button>
        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
