<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customers List</title>
    <!-- Thêm Bootstrap 5 qua CDN (Không cần cài local) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Thêm Google Fonts để nhìn xịn xò hơn -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .table-hover tbody tr:hover {
            background-color: #f1f3f5;
            transition: 0.2s ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">Quản Lý Khách Hàng</h2>
        <span class="badge bg-success fs-6">
            Tổng cộng: <span th:text="${#lists.size(customers)}">0</span> người
        </span>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th class="text-center">ID</th>
                <th>Tên Khách Hàng</th>
                <th>Email</th>
                <th>Địa Chỉ</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${customers}">
                <td class="text-center fw-bold" th:text="${c.id}"></td>
                <td>
                    <!-- Nút bấm nhìn sang trọng hơn -->
                    <a th:href="@{/customers/detail(id=${c.id})}" 
                       class="text-decoration-none fw-semibold text-primary" 
                       th:text="${c.name}">Name</a>
                </td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.address}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
