<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trả Sách - Quản Lý Thư Viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            
            <!-- Card Trả Sách -->
            <div class="card shadow border-0 rounded-4 overflow-hidden">
                <!-- Header -->
                <div class="card-header bg-success text-white text-center py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-arrow-counterclockwise me-2"></i>Trả Lại Sách
                    </h4>
                </div>

                <div class="card-body p-4">
                    <!-- Thông báo lỗi (nếu có) -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Mã mượn sách không hợp lệ!</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <p class="text-muted text-center mb-4">
                        Vui lòng nhập <strong>Mã mượn sách (5 chữ số)</strong> đã được cung cấp khi bạn thực hiện mượn sách để hoàn tất thủ tục trả sách.
                    </p>

                    <!-- Form xác nhận trả sách -->
                    <form th:action="@{/books/confirm-return}" method="post">
                        <!-- Input ẩn chứa ID phiếu mượn -->
                        <input type="hidden" name="borrowId" th:value="${id}">

                        <!-- Ô nhập mã mượn sách -->
                        <div class="mb-4">
                            <label for="borrowCode" class="form-label fw-semibold text-dark">
                                Mã Mượn Sách:
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted">
                                    <i class="bi bi-key-fill"></i>
                                </span>
                                <input type="text" 
                                       id="borrowCode" 
                                       name="borrowCode" 
                                       class="form-control form-control-lg text-center fw-bold letter-spacing-2" 
                                       placeholder="Ví dụ: 12345" 
                                       maxlength="5"
                                       pattern="[0-9]{5}"
                                       title="Mã mượn sách gồm 5 chữ số"
                                       required 
                                       autofocus>
                            </div>
                            <div class="form-text text-muted">
                                Nhập chính xác 5 chữ số của phiếu mượn.
                            </div>
                        </div>

                        <!-- 2 Nút Xác nhận và Quay lại -->
                        <div class="d-flex gap-2 pt-2">
                            <!-- Nút Hủy / Quay lại -->
                            <a th:href="@{/books/borrowing-list}" class="btn btn-outline-secondary px-4 fw-semibold flex-fill">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <!-- Nút Xác nhận trả sách -->
                            <button type="submit" class="btn btn-success px-4 fw-semibold flex-fill">
                                <i class="bi bi-check-circle me-1"></i> Xác Nhận Trả
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
