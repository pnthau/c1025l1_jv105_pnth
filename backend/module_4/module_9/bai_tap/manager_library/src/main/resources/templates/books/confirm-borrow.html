<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Mượn Sách - Quản Lý Thư Viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .code-display { 
            letter-spacing: 4px; 
            font-family: 'Courier New', Courier, monospace; 
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <!-- Card Xác Nhận -->
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Header Card -->
                <div class="card-header bg-warning text-dark py-3 text-center border-0">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-shield-lock-fill me-2"></i>Xác Nhận Phiếu Mượn
                    </h5>
                </div>
                
                <!-- Body Card -->
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/books/confirm-borrow}" method="post">
                        <!-- ID ngầm -->
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        
                        <!-- Thông tin sách -->
                        <div class="text-center mb-4">
                            <p class="text-muted mb-1 small text-uppercase fw-semibold">Cuốn sách bạn chọn:</p>
                            <h4 class="fw-bold text-primary mb-0" th:text="${book.name}">Tên cuốn sách</h4>
                        </div>

                        <!-- Khối hiển thị mã -->
                        <div class="alert alert-light text-center p-3 mb-4 border border-2 border-warning rounded-3 shadow-sm">
                            <small class="text-uppercase fw-bold text-secondary d-block mb-1">Mã xác nhận của bạn</small>
                            <div class="display-5 fw-bold text-danger code-display" th:text="${borrowCode}">12345</div>
                            <small class="text-muted mt-2 d-block fst-italic">
                                <i class="bi bi-info-circle me-1"></i> Mã này được dùng để xác nhận mượn và trả sách
                            </small>
                        </div>

                        <!-- Ô nhập mã -->
                        <div class="mb-4">
                            <label for="borrowCodeInput" class="form-label fw-bold text-dark">Vui lòng nhập lại mã xác nhận:</label>
                            <div class="input-group input-group-lg shadow-sm">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="bi bi-keyboard text-muted"></i>
                                </span>
                                <input type="text" class="form-control border-start-0 text-center fw-bold fs-4" 
                                       id="borrowCodeInput" name="borrowCode" placeholder="•••••" 
                                       autocomplete="off" required>
                            </div>
                            
                            <!-- Báo lỗi nếu nhập sai -->
                            <div th:if="${error != null}" class="text-danger mt-2 small fw-bold text-center animation-shake">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
                            </div>
                        </div>

                        <!-- Nút hành động -->
                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                                <i class="bi bi-check2-circle me-2"></i>Xác Nhận Mượn Sách
                            </button>
                            <a th:href="@{/books/detail/{id}(id=${book.id})}" class="btn btn-light border text-secondary fw-semibold">
                                <i class="bi bi-arrow-left me-1"></i> Trở về trang chi tiết
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
