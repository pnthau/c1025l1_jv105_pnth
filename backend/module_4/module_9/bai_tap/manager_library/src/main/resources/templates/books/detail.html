<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sách - Quản Lý Thư Viện</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- Card hiển thị chi tiết sách -->
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-book me-2"></i>Chi Tiết Cuốn Sách
                    </h4>
                </div>
                
                <div class="card-body p-4">
                    <!-- Tên sách -->
                    <div class="mb-3">
                        <label class="text-muted small fw-semibold">TÊN SÁCH:</label>
                        <h4 class="text-dark fw-bold" th:text="${book.name}">Lập trình Java căn bản</h4>
                    </div>

                    <hr class="my-3">

                    <!-- Số lượng còn lại -->
                    <div class="mb-4">
                        <label class="text-muted small fw-semibold d-block mb-1">SỐ LƯỢNG CÒN LẠI:</label>
                        <div>
                            <span th:if="${book.remaining > 0}" class="badge bg-success fs-6 px-3 py-2">
                                <i class="bi bi-check-circle me-1"></i>
                                Còn <span th:text="${book.remaining}">10</span> cuốn trong thư viện
                            </span>
                            <span th:unless="${book.remaining > 0}" class="badge bg-danger fs-6 px-3 py-2">
                                <i class="bi bi-x-circle me-1"></i> Hết sách (0 cuốn)
                            </span>
                        </div>
                    </div>

                    <!-- Nút Mượn sách và Quay lại -->
                    <div class="d-flex gap-2 pt-2">
                        <!-- Nút Mượn sách: Cho phép mượn nếu số lượng > 0 -->
                        <a th:if="${book.remaining > 0}"
                           th:href="@{/books/create/{id}(id=${book.id})}"
                           class="btn btn-warning text-white fw-semibold px-4 flex-grow-1">
                            <i class="bi bi-journal-arrow-down me-1"></i> Mượn Sách
                        </a>

                        <!-- Nút Disable khi hết sách -->
                        <button th:unless="${book.remaining > 0}" 
                                class="btn btn-secondary fw-semibold px-4 flex-grow-1" 
                                disabled>
                            <i class="bi bi-ban me-1"></i> Hết Sách
                        </button>

                        <!-- Nút Quay lại danh sách -->
                        <a th:href="@{/books}" class="btn btn-outline-secondary px-3">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
