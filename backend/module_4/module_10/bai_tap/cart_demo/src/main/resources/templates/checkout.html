<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán Đơn Hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        /* Breadcrumb Steps */
        .steps {
            display: flex;
            background: #fff;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        .step {
            flex: 1;
            text-align: center;
            padding: 15px 20px;
            position: relative;
            color: #666;
            font-size: 16px;
        }
        .step.active {
            background-color: #3bc2c6;
            color: white;
            font-weight: bold;
        }
        .step:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 0;
            right: -20px;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 20px solid #fff;
            z-index: 1;
        }
        .step.active::after {
            border-left-color: #3bc2c6;
            z-index: 2;
        }
        .step:not(:first-child) {
            padding-left: 40px;
        }
        
        /* Cart Container */
        .cart-container {
            background: #fff;
            border: 1px solid #ddd;
        }
        .cart-header {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ddd;
        }
        
        /* Cart Item */
        .cart-item {
            display: flex;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            align-items: flex-start;
        }
        .item-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 1px solid #eee;
            margin-right: 30px;
        }
        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 15px;
        }
        .item-name {
            color: #c9302c;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
        .info-row {
            display: flex;
            align-items: center;
        }
        .info-label {
            width: 90px;
            color: #666;
        }
        .info-val.green {
            color: #28a745;
        }

        /* Cart Footer */
        .cart-footer {
            padding: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            background-color: #fcfcfc;
            border-bottom: 1px solid #ddd;
        }
        .cart-footer .label {
            color: #c9302c;
            margin-right: 15px;
        }
        .cart-footer .total {
            font-weight: bold;
        }
        
        /* Checkout Form */
        .checkout-form {
            padding: 30px;
            background: #fff;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group input {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .submit-btn {
            padding: 12px 30px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
        
        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    
    <!-- Steps từ Fragment (Truyền số 2 để sáng Bước 2) -->
    <div th:replace="~{layout :: step-navigation(2)}"></div>

    <!-- Container -->
    <div class="cart-container">
        <div class="cart-header">
            XÁC NHẬN ĐƠN HÀNG CỦA BẠN
        </div>
        
        <!-- Danh sách sản phẩm -->
        <div>
            <div class="cart-item" th:each="item : ${cartDisplay}">
                
                <!-- Ảnh -->
                <img class="item-img" th:src="${item.key.image}" alt="Hình sản phẩm" />
                
                <!-- Thông tin -->
                <div class="item-info">
                    <h3 class="item-name" th:text="${item.key.name}">Sản phẩm 1</h3>
                    
                    <div class="info-row">
                        <span class="info-label">Mã SP:</span>
                        <span class="info-val green" th:text="${item.key.id}">4564</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Đơn giá:</span>
                        <span class="info-val" th:text="${#numbers.formatDecimal(item.key.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">350.000 đ</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Số lượng:</span>
                        <span style="font-weight: bold; font-size: 16px;" th:text="${item.value}">2</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tổng cộng -->
        <div class="cart-footer">
            <span class="label">Tổng cộng:</span>
            <span class="total" th:text="${#numbers.formatDecimal(totalPayment, 0, 'COMMA', 0, 'POINT')} + ' đ'">1.480.000 đ</span>
        </div>
        
        <!-- Form điền thông tin khách hàng -->
        <div class="checkout-form">
            <form th:action="@{/checkout}" method="post">
                <div class="form-group">
                    <label for="customerName">Họ và tên người nhận hàng (*):</label>
                    <input type="text" id="customerName" name="customerName" required placeholder="Nhập tên của bạn...">
                </div>
                <button type="submit" class="submit-btn">Xác nhận Thanh toán ➡</button>
            </form>
        </div>
    </div>
    
    <a href="/cart" class="back-btn">⬅ Quay lại Giỏ hàng</a>

</body>
</html>
