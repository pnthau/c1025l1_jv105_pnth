<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Hàng Thành Công</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; }
        .steps { display: flex; background: #fff; margin-bottom: 20px; border: 1px solid #ddd; overflow: hidden; }
        .step { flex: 1; text-align: center; padding: 15px 20px; position: relative; color: #666; font-size: 16px; }
        .step.active { background-color: #3bc2c6; color: white; font-weight: bold; }
        .step:not(:last-child)::after { content: ""; position: absolute; top: 0; right: -20px; border-top: 25px solid transparent; border-bottom: 25px solid transparent; border-left: 20px solid #fff; z-index: 1; }
        .step.active::after { border-left-color: #3bc2c6; z-index: 2; }
        .step:not(:first-child) { padding-left: 40px; }
        
        .success-box { background: #fff; padding: 50px; text-align: center; border: 1px solid #ddd; margin-top: 30px;}
        .success-box h2 { color: #28a745; margin-bottom: 20px; }
        .btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    
    <!-- Steps từ Fragment (Truyền số 3 để sáng Bước 3) -->
    <div th:replace="~{layout :: step-navigation(3)}"></div>

    <div class="success-box">
        <h2>🎉 ĐẶT HÀNG THÀNH CÔNG!</h2>
        <p>Cảm ơn bạn đã tin tưởng và mua sắm tại cửa hàng của chúng tôi.</p>
        <p>Chúng tôi sẽ sớm liên hệ để giao hàng cho bạn.</p>
        <a href="/products" class="btn">Tiếp tục mua sắm</a>
    </div>

</body>
</html>
