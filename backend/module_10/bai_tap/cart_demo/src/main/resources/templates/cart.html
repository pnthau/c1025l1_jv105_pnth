<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        /* Breadcrumb Steps */
        .steps {
            display: flex;
            background: #fff;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        .step {
            flex: 1;
            text-align: center;
            padding: 15px 20px;
            position: relative;
            color: #666;
            font-size: 16px;
        }
        .step.active {
            background-color: #3bc2c6;
            color: white;
            font-weight: bold;
        }
        .step:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 0;
            right: -20px;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 20px solid #fff;
            z-index: 1;
        }
        .step.active::after {
            border-left-color: #3bc2c6;
            z-index: 2;
        }
        .step:not(:first-child) {
            padding-left: 40px;
        }
        
        /* Cart Container */
        .cart-container {
            background: #fff;
            border: 1px solid #ddd;
        }
        .cart-header {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ddd;
        }
        
        /* Cart Item */
        .cart-item {
            display: flex;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            align-items: flex-start;
        }
        .btn-remove {
            background-color: #006b96;
            color: white;
            text-decoration: none;
            width: 30px;
            height: 30px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 20px;
            border-radius: 2px;
        }
        .btn-remove:hover {
            background-color: #005073;
        }
        .item-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 1px solid #eee;
            margin-right: 30px;
        }
        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 15px;
        }
        .item-name {
            color: #c9302c;
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
        .info-row {
            display: flex;
            align-items: center;
        }
        .info-label {
            width: 90px;
            color: #666;
        }
        .info-val.green {
            color: #28a745;
        }
        
        /* Quantity Controls */
        .qty-controls {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 3px;
            overflow: hidden;
            width: 90px;
        }
        .qty-btn {
            background: #f8f9fa;
            color: #333;
            text-decoration: none;
            padding: 5px 10px;
            font-weight: bold;
        }
        .qty-btn:hover {
            background: #e2e6ea;
        }
        .qty-val {
            flex: 1;
            text-align: center;
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
            padding: 5px 0;
        }

        /* Cart Footer */
        .cart-footer {
            padding: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .cart-footer .label {
            color: #c9302c;
            margin-right: 15px;
        }
        .cart-footer .total {
            font-weight: bold;
        }
        
        .empty-cart {
            padding: 50px;
            text-align: center;
            color: #666;
            font-size: 18px;
        }
        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background-color: #3bc2c6;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    
    <!-- Steps từ Fragment -->
    <div th:replace="~{layout :: step-navigation(1)}"></div>

    <!-- Cart Box -->
    <div class="cart-container">
        <div class="cart-header">
            GIỎ HÀNG (<span th:text="${cartDisplay.size()}">0</span>)
        </div>
        
        <!-- Danh sách sản phẩm -->
        <div th:if="${!cartDisplay.empty}">
            <div class="cart-item" th:each="item : ${cartDisplay}">
                <!-- Nút Xóa -->
                <a th:href="@{/cart/remove/{id}(id=${item.key.id})}" class="btn-remove" title="Xóa sản phẩm">&times;</a>
                
                <!-- Ảnh -->
                <img class="item-img" th:src="${item.key.image}" alt="Hình sản phẩm" />
                
                <!-- Thông tin -->
                <div class="item-info">
                    <h3 class="item-name" th:text="${item.key.name}">Sản phẩm 1</h3>
                    
                    <div class="info-row">
                        <span class="info-label">Mã SP:</span>
                        <span class="info-val green" th:text="${item.key.id}">4564</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Đơn giá:</span>
                        <span class="info-val" th:text="${#numbers.formatDecimal(item.key.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">350.000 đ</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Số lượng:</span>
                        <div class="qty-controls">
                            <!-- Nút Trừ -->
                            <a class="qty-btn" th:href="@{/cart/decrease/{id}(id=${item.key.id})}">-</a>
                            <!-- Số lượng -->
                            <div class="qty-val" th:text="${item.value}">2</div>
                            <!-- Nút Cộng -->
                            <a class="qty-btn" th:href="@{/cart/increase/{id}(id=${item.key.id})}">+</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Nếu giỏ trống -->
        <div class="empty-cart" th:if="${cartDisplay.empty}">
            Giỏ hàng của bạn đang trống!
        </div>

        <!-- Tổng cộng -->
        <div class="cart-footer" th:if="${!cartDisplay.empty}">
            <span class="label">Tổng cộng:</span>
            <span class="total" th:text="${#numbers.formatDecimal(totalPayment, 0, 'COMMA', 0, 'POINT')} + ' đ'">1.480.000 đ</span>
        </div>
    </div>
    
    <div style="margin: 20px 20px; display: flex; justify-content: space-between;">
        <a href="/products" class="back-btn" style="margin: 0;">⬅ Tiếp tục mua sắm</a>
        <a th:if="${!cartDisplay.empty}" href="/checkout" class="back-btn" style="margin: 0; background-color: #28a745;">Tiến hành Đặt hàng ➡</a>
    </div>

</body>
</html>
