<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product-card {
            border: 1px solid #ccc;
            padding: 15px;
            width: 250px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }
        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-card h3 {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .product-card .price {
            color: #d9534f;
            font-weight: bold;
            font-size: 1.1em;
        }
        a.btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a.btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Danh sách sản phẩm</h1>
        <a th:href="@{/cart}" class="btn" style="background-color: #28a745;">🛒 Xem giỏ hàng</a>
    </div>
    
    <div class="product-list">
        <!-- Duyệt qua danh sách sản phẩm -->
        <div class="product-card" th:each="product : ${products}">
            <img th:if="${product.image != null}" th:src="${product.image}" alt="Product Image"/>
            <img th:unless="${product.image != null}" src="https://via.placeholder.com/250x200?text=No+Image" alt="No Image"/>
            <h3 th:text="${product.name}">Tên sản phẩm</h3>
            <p class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">100.000 VNĐ</p>
            <p class="quantity" th:text="${product.quantity}"></p>
            <a class="btn" th:href="@{/products/{id}(id=${product.id})}">Xem chi tiết</a>
            <a th:if="${product.quantity > 0}" class="btn" style="background-color: #28a745;" th:href="@{/add-to-cart/{id}(id=${product.id})}">Thêm vào giỏ</a>
            <span th:unless="${product.quantity > 0}" class="btn" style="background-color: #cccccc; cursor: not-allowed; color: #666;">Hết hàng</span>
        </div>
    </div>
    
    <div th:if="${products.empty}">
        <p>Không có sản phẩm nào trong cửa hàng.</p>
    </div>
</body>
</html>
